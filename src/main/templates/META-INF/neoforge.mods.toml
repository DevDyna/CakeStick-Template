license="${mod_license}"

[[mixins]]
config = "${mod_id}.mixins.json"

[[mods]] 
modId="${mod_id}" 
version="${mod_version}" 
displayName="${mod_name}" 
description='''${mod_description}'''

[[dependencies.${mod_id}]] 
    modId="neoforge" 
    type="required" 
    versionRange="[${neo_version},)" 
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="cakesticklib"
    type="required"
    versionRange="${cakesticklib_range}"
    ordering="BEFORE"
    side="BOTH"
